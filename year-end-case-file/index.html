<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ch 7: Prepaid Expenses and Expenses Payable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunk:#EEF0F4; --ink:#141922; --muted:#58606E; --lines:#DCE0E7;
  --accent:#2C47D6; --accent-soft:#E7EBFC;
  --prepaid:#0B7563; --prepaid-soft:#DDF2EC;
  --payable:#B2470D; --payable-soft:#FBE9DB;
  --used:#5B6474;
  --correct:#17803A; --correct-soft:#E1F3E6;
  --incorrect:#BE2A2C; --incorrect-soft:#FBE5E5;
  --hint:#FFF4CC; --hint-border:#E8D27C;
  --thought:#F1ECFB; --thought-line:#C9B8EE;
  --yearend:#C81E1E;
  --font-display:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body:'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.5;
  overflow-x:hidden; font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{font-family:var(--font-display); line-height:1.25; margin:0 0 8px;}
h1{font-size:1.6rem;} h2{font-size:1.3rem;} h3{font-size:1.1rem;} h4{font-size:1rem;}
p{margin:0 0 10px;}
a{color:var(--accent);}
button,input,select,textarea{font-family:inherit; font-size:1rem;}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important;} }

.shell{max-width:1040px; margin:0 auto; padding:0 16px;}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch;}

/* ---- Sticky nav: top bar + stage tabs, one compact fixed block ---- */
#nav-sticky{position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--lines);}
#topbar .row{display:flex; align-items:center; gap:16px; padding:6px 0; flex-wrap:wrap;}
.brand{font-family:var(--font-display); font-weight:800; font-size:1rem; display:flex; flex-direction:column; line-height:1.2;}
.brand-short{display:none;}
.brand-sub{font-family:var(--font-body); font-weight:600; font-size:.75rem; color:var(--muted);}
@media (max-width:1399px){ .brand-long{display:none;} .brand-short{display:inline;} .brand-sub{display:none;} .brand{font-size:.9rem;} }
.segmented{display:inline-flex; background:var(--sunk); border-radius:10px; padding:3px; gap:2px;}
.segmented button{
  white-space:nowrap; border:none; background:transparent; padding:7px 12px; border-radius:8px; cursor:pointer;
  font-weight:700; color:var(--muted); min-height:36px; font-size:.9rem;
}
.segmented button.active{background:var(--accent); color:#fff;}
.btn{
  border:1px solid var(--lines); background:var(--surface); color:var(--ink); border-radius:8px;
  padding:9px 14px; cursor:pointer; font-weight:700; min-height:40px;
}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-lg{font-size:1.05rem; padding:14px 28px; min-height:48px;}
.spacer{flex:1;}
#objectivesBtn{white-space:nowrap;}
/* One row on laptops (1280px and 1366px); only phones may wrap. */
@media (min-width:700px){ #topbar .row{flex-wrap:nowrap;} }
/* Phones: title on its own row, then the switcher and Objectives side by side. */
@media (max-width:559px){
  #topbar .row{gap:2px 10px;}
  .brand{flex:1 1 100%;}
  .segmented button{padding:7px 9px;}
  #objectivesBtn{padding:7px 10px; min-height:36px;}
}

/* ---- Stage tabs row: Back / tabs / Next, one slim row ---- */
#stepper{background:var(--sunk); border-top:1px solid var(--lines);}
/* The tab row may be wider than the 1040px content column so every label (Lesson 2's are
   longer) stays fully visible on a laptop without making the bar taller. On phones the
   track still scrolls sideways. */
#stepper .shell{max-width:1400px;}
.tabrow{display:flex; align-items:center; gap:6px; padding:6px 0;}
.tabrow .track{display:flex; gap:4px; overflow-x:auto; flex:1 1 auto; scrollbar-width:thin;}
.tabrow .navbtn{flex:0 0 auto; padding:7px 12px; min-height:36px; font-size:.85rem;}
.step-tab{
  flex:0 0 auto; border:1px solid var(--lines); background:var(--surface); border-radius:20px;
  padding:7px 9px; font-size:.8rem; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap;
  min-height:36px;
}
.step-tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.step-tab.locked{opacity:.55; cursor:not-allowed; background:var(--sunk);}
.lock-msg{
  text-align:center; font-size:.82rem; font-weight:700; color:var(--incorrect); padding:0;
  max-height:0; overflow:hidden; opacity:0; transition:opacity .2s, max-height .2s;
}
.lock-msg.show{opacity:1; max-height:30px; padding-bottom:6px;}

/* ---- Stage header ---- */
.stage-header{padding:18px 0 6px;}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.chip{
  display:inline-block; border-radius:999px; padding:4px 12px; font-size:.8rem; font-weight:700;
  background:var(--sunk); color:var(--muted);
}
.chip.group{background:var(--accent-soft); color:var(--accent);}

/* ---- Generic content blocks ---- */
.card{background:var(--surface); border:1px solid var(--lines); border-radius:14px; padding:16px; margin-bottom:16px;}
.card.sunk{background:var(--sunk); border-color:var(--lines);}
.card h3{margin-bottom:6px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:640px){ .grid-2{grid-template-columns:1fr;} }
.instruct{font-weight:700; color:var(--accent); margin:0 0 10px;}

/* ---- Section / button spacing ---- */
.section-gap{margin-top:44px;}
.btnrow{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:44px;}
.reveal-next-btn{display:block; width:fit-content; margin:44px auto 0;}

/* ---- Q-A / Q-B tokens ---- */
.tok-qa{color:var(--prepaid); font-weight:800;}
.tok-qb{color:var(--payable); font-weight:800;}
.tag-qa{background:var(--prepaid-soft); color:var(--prepaid); border-radius:6px; padding:1px 8px; font-weight:700;}
.tag-qb{background:var(--payable-soft); color:var(--payable); border-radius:6px; padding:1px 8px; font-weight:700;}

/* ---- News ---- */
.news-card{background:var(--surface); border:1px solid var(--lines); border-radius:14px; padding:18px; margin-bottom:16px;}
.news-headline{font-family:var(--font-display); font-weight:800; font-size:1.3rem; margin-bottom:8px;}
.news-meta{color:var(--muted); font-size:.9rem; margin-bottom:12px;}
.stat-callout{
  background:var(--incorrect-soft); border:1px solid var(--incorrect); border-radius:10px; padding:14px;
  font-weight:700; margin:12px 0;
}
.stat-callout b{color:var(--incorrect); font-size:1.1rem;}
.excerpt-heading{font-family:var(--font-display); font-weight:800; margin:16px 0 8px;}
.excerpt-card{
  border-left:4px solid var(--accent); background:var(--sunk); border-radius:0 10px 10px 0; padding:10px 14px;
  margin-bottom:8px;
}
.excerpt-card a{font-weight:700; text-decoration:none;}
.excerpt-card .outlet{color:var(--muted); font-size:.85rem;}
.sources{font-size:.8rem; color:var(--muted); margin-top:14px; border-top:1px solid var(--lines); padding-top:10px;}
.sources li{margin-bottom:6px;}

/* ---- Chat window (generic messaging-app style; not WhatsApp's name/logo/colours) ---- */
.chatwin{border:1px solid var(--lines); border-radius:18px; overflow:hidden; margin-bottom:16px; box-shadow:0 6px 20px rgba(20,25,34,.09); background:#fff;}
.chatwin-header{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--lines); background:#fff;}
.chatwin-avatar{width:40px; height:40px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--font-display); font-size:.85rem; flex:0 0 auto;}
.chatwin-avatar.jay{background:var(--muted);}
.chatwin-namewrap{display:flex; flex-direction:column; gap:2px;}
.chatwin-name{display:flex; align-items:center; gap:6px; font-weight:800; font-family:var(--font-display); font-size:.95rem;}
.chatwin-bubbleicon{color:var(--muted); flex:0 0 auto;}
.chatwin-role{font-family:var(--font-body); font-weight:600; color:var(--muted); font-size:.85rem;}
.chatwin-online{font-size:.72rem; color:var(--muted);}
.chatwin-online::before{content:"\25CF"; color:#3AA76D; font-size:.6rem; margin-right:4px;}
.chatwin-body{padding:18px 16px; background-repeat:repeat; background-color:#fbfbfa;}
.chatwin-chip{display:table; margin:0 auto 14px; background:rgba(20,25,34,.55); color:#fff; font-size:.72rem; font-weight:700; padding:4px 14px; border-radius:999px;}
.chatwin-chip.unread{background:var(--accent);}
.chatwin-msg{margin-bottom:14px;}
.chatwin-msg:last-child{margin-bottom:0;}
.chatwin-bubble{
  position:relative; background:#fff; border-radius:4px 16px 16px 16px; padding:12px 54px 16px 14px;
  max-width:540px; box-shadow:0 1px 3px rgba(20,25,34,.12);
}
.chatwin-time{position:absolute; right:12px; bottom:6px; font-size:.68rem; color:var(--muted);}

/* Group chat variant: generic group icon, per-message small avatar, coloured sender name. */
.chatwin-avatar.group{background:var(--ink);}
.chatwin-msg-group{display:flex; align-items:flex-start; gap:8px;}
.chatwin-avatar-sm{width:28px; height:28px; font-size:.68rem;}
.chatwin-sender{font-weight:800; font-size:.78rem; margin-bottom:3px;}
.chatwin-sender.ceo{color:var(--accent);}
.chatwin-sender.jay{color:var(--payable);}

/* Thought bubble: outside the chat window, clearly different, used in Case Debrief. */
.thought-msg{margin-bottom:16px;}
.thought-label{font-family:var(--font-display); font-weight:800; font-size:.92rem; margin-bottom:6px;}
.thought-cloud{
  position:relative; background:var(--thought); border:1px solid var(--thought-line); border-radius:28px;
  padding:18px 22px; max-width:640px;
}
.thought-icon{font-size:1.2rem; margin-bottom:4px;}
.thought-trail{display:flex; align-items:center; gap:6px; margin:10px 0 0 22px;}
.thought-dot{background:var(--thought); border:1px solid var(--thought-line); border-radius:50%; flex:0 0 auto;}
.thought-dot.d1{width:16px; height:16px;}
.thought-dot.d2{width:11px; height:11px;}
.thought-dot.d3{width:7px; height:7px;}
.thought-avatar{
  width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center;
  justify-content:center; font-weight:800; font-family:var(--font-display); font-size:.78rem; flex:0 0 auto;
}

/* ---- Details / collapsibles ---- */
details.hint{background:var(--hint); border:1px solid var(--hint-border); border-radius:10px; padding:10px 14px; margin:12px 0;}
details.hint summary{cursor:pointer; font-weight:700; min-height:40px; display:flex; align-items:center;}
details.teacher{background:var(--sunk); border:1px solid var(--lines); border-radius:10px; padding:10px 14px; margin:12px 0;}
details.teacher summary{cursor:pointer; font-weight:700; min-height:40px; display:flex; align-items:center; color:var(--muted);}
details > summary{list-style:none;}
details > summary::-webkit-details-marker{display:none;}

/* ---- Evidence cards ---- */
.evidence-card{background:var(--surface); border:1px solid var(--lines); border-radius:10px; padding:16px; margin-bottom:14px;}
.evidence-card .facts{margin-top:6px;}
.sorter{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
.sorter label{
  border:1px solid var(--lines); border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:700;
  min-height:40px; display:flex; align-items:center; gap:6px;
}
.sorter input{margin:0;}
.card-feedback{margin-top:8px; padding:8px 12px; border-radius:8px; font-weight:700; display:none;}
.card-feedback.show{display:block;}
.card-feedback.correct{background:var(--correct-soft); color:var(--correct);}
.card-feedback.incorrect{background:var(--incorrect-soft); color:var(--incorrect);}

/* ---- Paid-vs-used month model (Stage 1: "Show me the timeline") ---- */
.tl-summary{font-weight:700; font-size:.9rem; margin:14px 0 6px;}
.tl-summary:first-child{margin-top:0;}
.tl-row{display:flex; flex-wrap:wrap; justify-content:flex-start; gap:4px; margin-bottom:4px;}
.tl-box{
  flex:1 1 52px; min-width:48px; border-radius:8px; padding:6px 4px; text-align:center; font-size:.75rem;
  font-weight:600; line-height:1.3; border:1px solid var(--lines); background:#fff; color:var(--muted);
}
.tl-box.filled{background:var(--used); color:#fff; border-color:var(--used);}
.tl-box.tl-yearend{border-right:4px solid var(--yearend);}
.tl-box.tappable{cursor:pointer; user-select:none;}

/* ---- Month strip (interactive; Stage 2 / Exit Ticket) ---- */
.month-strip{display:flex; flex-wrap:wrap; align-items:center; gap:4px; padding:4px 0;}
.month-chip{
  flex:1 1 52px; min-width:48px; border-radius:8px; padding:8px 4px; display:flex; align-items:center; justify-content:center;
  font-weight:600; font-size:.8rem; cursor:pointer; text-align:center; background:#fff; color:var(--muted);
  border:1px solid var(--lines); user-select:none;
}
.month-chip.used{background:var(--used); color:#fff; border-color:var(--used);}
.month-chip.yearend{border-right:4px solid var(--yearend);}

/* Accounting Manual pages only: these are already-solved worked examples, so
   colour-coding used/not-used months is fine (there is no classification answer
   left to give away, unlike the student's own interactive strip above). */
.month-chip.manual-prepaid{background:var(--prepaid-soft); color:var(--prepaid); border-color:var(--prepaid);}
.month-chip.manual-payable{background:var(--payable-soft); color:var(--payable); border-color:var(--payable);}
.month-counter{margin-top:10px; font-size:.85rem; color:var(--muted); font-weight:700;}

/* Shared "30 Sep" red year-end label, used beside every month strip and timeline row. */
.yearend-label{
  flex:0 0 auto; display:flex; align-items:center; font-size:.72rem; font-weight:800; color:var(--yearend);
  padding:0 4px;
}

/* ---- Fields ---- */
.field-row{margin-bottom:12px;}
.field-row label{display:block; font-weight:700; margin-bottom:4px; font-size:.92rem;}
.field-input-wrap{display:flex; align-items:center; gap:6px;}
.field-unit{color:var(--muted);}
.field-input{
  border:1px solid var(--lines); border-radius:8px; padding:8px 10px; width:160px;
  min-height:40px;
}
.field-input[readonly]{background:var(--sunk); color:var(--muted);}
.field-feedback{margin-top:6px; padding:6px 10px; border-radius:8px; font-size:.9rem; font-weight:700; display:none;}
.field-feedback.show{display:block;}
.field-feedback.correct{background:var(--correct-soft); color:var(--correct);}
.field-feedback.incorrect{background:var(--incorrect-soft); color:var(--incorrect);}

/* ---- Calculation chips ---- */
.calc-chip{background:var(--sunk); border-radius:8px; padding:8px 12px; margin-bottom:6px;}

/* ---- Worked example (Accounting Manual) ---- */
.manual-page{
  position:relative; background:#FBFAF6; border:1px solid var(--lines); border-radius:4px; padding:18px 18px 18px 22px;
  margin-bottom:16px; border-left:6px solid var(--accent);
}
.manual-tag{
  display:inline-block; background:var(--ink); color:#fff; font-weight:800; font-size:.72rem; letter-spacing:.06em;
  border-radius:4px; padding:3px 8px; margin-bottom:8px;
}
.manual-header{color:var(--muted); font-weight:700; font-size:.85rem; margin-bottom:10px;}

/* ---- Tabs (Stage 2 workspace) ---- */
.tabbar{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.tabbtn{
  border:1px solid var(--lines); background:var(--surface); border-radius:10px 10px 0 0; padding:9px 14px;
  font-weight:700; cursor:pointer; color:var(--muted); min-height:40px;
}
.tabbtn.active{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
.tabpanel{display:none;}
.tabpanel.active{display:block;}

/* ---- Sentence frame ---- */
.frame{background:var(--sunk); border-radius:10px; padding:14px; line-height:2.1; font-size:1rem;}
.frame input{
  border:none; border-bottom:2px solid var(--accent); background:transparent;
  width:80px; text-align:center; padding:2px 4px; margin:0 2px;
}
.frame select{border:none; border-bottom:2px solid var(--accent); background:transparent; font-weight:700; margin:0 2px;}

/* Exit Ticket "Check my answers": a tick or cross appended right after each blank or
   dropdown, plus a list of context-specific feedback for whatever is still wrong. */
.fb-icon{display:inline-block; font-weight:800; margin:0 4px; font-size:1rem;}
.fb-icon.correct{color:var(--correct);}
.fb-icon.wrong{color:var(--incorrect);}
.fb.correct{border-bottom-color:var(--correct); background:var(--correct-soft);}
.fb.wrong{border-bottom-color:var(--incorrect); background:var(--incorrect-soft);}
.fb-select.correct{border-bottom-color:var(--correct);}
.fb-select.wrong{border-bottom-color:var(--incorrect);}

/* Theory-check MCQs: a vertical list of full-sentence radio options. */
.mcq-group{display:flex; flex-direction:column; gap:8px; margin:10px 0;}
.mcq-option{
  display:flex; align-items:flex-start; gap:10px; border:1px solid var(--lines); border-radius:8px;
  padding:10px 12px; cursor:pointer; min-height:40px;
}
.mcq-option input{margin-top:4px; flex:0 0 auto;}
select.theory-select{
  border:1px solid var(--lines); border-radius:8px; padding:8px 10px; min-height:40px; background:#fff;
  font-weight:600; width:100%; max-width:380px;
}

/* ---- Rating ---- */
.rate-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
.rate-btns{display:flex; gap:4px;}
.rate-btns button{
  width:36px; height:36px; border-radius:8px; border:1px solid var(--lines); background:var(--surface);
  cursor:pointer; font-weight:700;
}
.rate-btns button.selected{background:var(--accent); color:#fff; border-color:var(--accent);}

/* ---- Modal ---- */
.overlay{position:fixed; inset:0; background:rgba(20,25,34,.5); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 16px; overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:var(--surface); border-radius:16px; padding:22px; max-width:640px; width:100%;}
.modal .close-row{display:flex; justify-content:flex-end;}

textarea.freeform{width:100%; min-height:70px; border:1px solid var(--lines); border-radius:8px; padding:10px; font-family:var(--font-body); resize:vertical;}
input.text-input{border:1px solid var(--lines); border-radius:8px; padding:8px 10px; min-height:40px; width:100%;}

.placeholder-box{padding:60px 20px; text-align:center; color:var(--muted); background:var(--sunk); border-radius:14px;}

.clear-link{
  display:block; width:fit-content; margin:40px auto 24px; background:none; border:none; color:var(--muted);
  font-size:.85rem; text-decoration:underline; cursor:pointer; padding:8px; min-height:40px;
}
.clear-link:hover{color:var(--accent);}

/* ---- Lesson 2: ledgers, case file panel ---- */
.done-by{font-weight:700; color:var(--muted); font-size:.9rem; margin:0 0 10px;}
.ledger-card{background:var(--surface); border:1px solid var(--lines); border-radius:10px; padding:14px; margin-bottom:16px;}
.ledger-card h4{margin-bottom:8px;}
table.ledger{border-collapse:collapse; width:100%; font-size:.95rem;}
table.ledger th, table.ledger td{padding:6px 8px; border-bottom:1px solid var(--lines); vertical-align:top;}
table.ledger th{text-align:left; border-bottom:2px solid var(--ink); font-size:.85rem;}
table.ledger .num{text-align:right; border-left:1px solid var(--lines);}
table.ledger tr.yr td{font-weight:700;}
.ledger .ref{color:var(--muted); font-size:.78rem; margin-right:4px;}
@media (max-width:560px){
  table.ledger{font-size:.85rem;}
  table.ledger th, table.ledger td{padding:5px 4px;}
}
details.casefile{background:var(--surface); border:1px solid var(--lines); border-radius:10px; padding:10px 14px; margin:0 0 16px;}
details.casefile summary{cursor:pointer; font-weight:700; min-height:40px; display:flex; align-items:center;}
@media (max-width:560px){
  table.casetable{font-size:.8rem;}
  table.casetable th, table.casetable td{padding:6px 3px !important;}
}
table.ledger input.fb{width:92px; border:1px solid var(--lines); border-radius:6px; padding:4px 6px; min-height:38px; text-align:right; background:#fff;}
table.ledger input.fb.narr{width:100%; max-width:420px; text-align:left; margin-top:4px;}
table.ledger select.fb-select{width:100%; max-width:340px; border:1px solid var(--lines); border-radius:6px; padding:4px; min-height:38px; background:#fff; font-weight:600;}
table.ledger input.fb.correct, table.ledger select.fb-select.correct{border-color:var(--correct); background:var(--correct-soft);}
table.ledger input.fb.wrong, table.ledger select.fb-select.wrong{border-color:var(--incorrect); background:var(--incorrect-soft);}
@media (max-width:560px){
  table.ledger input.fb{width:56px; padding:4px 3px; font-size:.9rem;}
  table.ledger select.fb-select{font-size:.85rem; padding:4px 2px;}
}
.closing-label{margin:24px 0 8px; font-weight:700;}
.notposted{display:inline-block; background:var(--sunk); color:var(--muted); border:1px solid var(--lines); border-radius:6px; padding:1px 8px; font-weight:700; font-size:.8rem; margin-right:6px;}
.entry-block{margin-bottom:28px;}

/* ============================== STORAGE ============================== */

const storage = {
  get(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(raw===null) return fallback;
      return JSON.parse(raw);
    }catch(e){ return fallback; }
  },
  set(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* storage unavailable; site still works */ }
  }
};

/* Every stored key for a stage is prefixed "yecf.<storeKey>." so "Clear my answers"
   can wipe exactly (and only) that stage's saved answers. */
/* Attempt counters also live in memory so the second-attempt hints still appear when
   localStorage is blocked. */
const memAttempts = {};
function getAttempts(storeKey, id){
  const k = `yecf.${storeKey}.attempts.${id}`;
  return storage.get(k, memAttempts[k] || 0);
}
function setAttempts(storeKey, id, n){
  const k = `yecf.${storeKey}.attempts.${id}`;
  memAttempts[k] = n;
  storage.set(k, n);
}
function getRevealed(storeKey){ return storage.get(`yecf.${storeKey}.reveal`, 1); }
function setRevealed(storeKey, n){ storage.set(`yecf.${storeKey}.reveal`, n); }

function clearStageAnswers(storeKey){
  const prefix = `yecf.${storeKey}.`;
  const revealKey = `${prefix}reveal`;
  Object.keys(memAttempts).filter(k => k.startsWith(prefix)).forEach(k => delete memAttempts[k]);
  try{
    Object.keys(localStorage)
      .filter(k => k.startsWith(prefix) && k!==revealKey)
      .forEach(k => localStorage.removeItem(k));
  }catch(e){ /* storage unavailable; nothing to clear */ }
}

   always stay open. ?teacher in the URL unlocks everything; no student-visible control for
   it. Lesson 2 is never locked behind Lesson 1 — each lesson tracks its own progress. */

const TEACHER_MODE = new URLSearchParams(location.search).has('teacher');

function getUnlockedUpTo(lesson){ return storage.get(`yecf.unlock.${lesson}`, 0); }
function unlockThrough(lesson, index){
  if(index > getUnlockedUpTo(lesson)){
    storage.set(`yecf.unlock.${lesson}`, index);
    refreshStepperUI();
  }
}
const HOMEWORK_MODE = new URLSearchParams(location.search).has('homework');
const HOMEWORK_STAGE_IDS = ['exit','memo'];   // the Exit Ticket (Lesson 1) and the Memo (Lesson 2)
function isStageUnlocked(lesson, index){
  if(TEACHER_MODE || index <= getUnlockedUpTo(lesson)) return true;
  const s = stagesFor(lesson)[index];
  return HOMEWORK_MODE && !!s && HOMEWORK_STAGE_IDS.includes(s.id);
}
/* Call once a stage has been fully seen (all Continues opened, or simply visited for a
   show-everything-at-once stage) to unlock the stage after it. */
function markStageSeen(storeKey){
  const lesson = storeKey.split('-')[0];
  const index = stagesFor(lesson).findIndex(s => s.storeKey===storeKey);
  if(index<0) return;
  /* ?homework: opening the Exit Ticket or the Memo directly must not unlock the stages
     before it (progress is one "highest unlocked" number), so only count it as seen if the
     student really got that far. */
  if(HOMEWORK_MODE && HOMEWORK_STAGE_IDS.includes(stagesFor(lesson)[index].id) && getUnlockedUpTo(lesson) < index) return;
  unlockThrough(lesson, index+1);
}

/* ============================== HELPERS ============================== */

function parseAmount(str){
  if(str===null || str===undefined) return null;
  const cleaned = String(str).replace(/[$\s ,]/g,'');
  if(cleaned==='') return null;
  const n = Number(cleaned);
  return isNaN(n) ? null : n;
}

function esc(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmt(n){
  const neg = n<0; n = Math.abs(n);
  const s = Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg?'−':'')+s;
}

function monthIndex(m,y){ return y*12 + MONTH_NAMES.indexOf(m); }
function monthsSpan(range){ return monthIndex(range.end.m,range.end.y) - monthIndex(range.start.m,range.start.y) + 1; }
function rangeLabelCompact(range){
  if(range.start.y === range.end.y){
    if(range.start.m===range.end.m) return `${range.start.m} ${range.start.y}`;
    return `${range.start.m} to ${range.end.m} ${range.end.y}`;
  }
  return `${range.start.m} ${range.start.y} to ${range.end.m} ${range.end.y}`;
}

function fieldRow(id, label, opts){
  opts = opts||{};
  const readonly = opts.readonly? 'readonly' : '';
  const value = opts.value!==undefined? ` value="${esc(opts.value)}"` : '';
  return `<div class="field-row" data-field-row="${id}">
    <label for="${id}">${label}</label>
    <div class="field-input-wrap">
      <span class="field-unit">${opts.unit===false?'':(opts.unit||'$')}</span>
      <input type="text" inputmode="decimal" id="${id}" class="field-input" ${readonly}${value} autocomplete="off">
    </div>
    <div class="field-feedback" id="${id}-fb" aria-live="polite"></div>
  </div>`;
}

function restoreField(storeKey, id){
  const el = document.getElementById(id);
  if(!el || el.readOnly) return;
  const key = `yecf.${storeKey}.field.${id}`;
  const saved = storage.get(key, null);
  if(saved!==null) el.value = saved;
  el.addEventListener('input', ()=> storage.set(key, el.value));
}

function checkFieldGroup(storeKey, ids, defs){
  ids.forEach(id=>{
    const def = defs[id];
    const input = document.getElementById(id);
    const fb = document.getElementById(id+'-fb');
    if(!def || !input || !fb) return;
    const parsed = parseAmount(input.value);
    const isCorrect = parsed!==null && Math.round(parsed*100)===Math.round(def.expected*100);
    fb.classList.add('show');
    if(isCorrect){
      fb.textContent = def.correct;
      fb.className = 'field-feedback show correct';
      setAttempts(storeKey, id, 0);
    } else {
      let attempts = getAttempts(storeKey, id)+1;
      setAttempts(storeKey, id, attempts);
      const key = parsed===null? null : Math.round(parsed);
      let msg = (key!==null && def.wrong[key]) ? def.wrong[key] : def.generic;
      if(attempts>=2 && def.pointer) msg += ' ' + def.pointer;
      fb.textContent = msg;
      fb.className = 'field-feedback show incorrect';
    }
  });
}

function buildMonthList(startMonth, startYear, endMonth, endYear){
  const months=[];
  let mi = MONTH_NAMES.indexOf(startMonth), yr = startYear;
  const guard = 40;
  let count=0;
  while(count<guard){
    months.push({month:MONTH_NAMES[mi], year:yr});
    if(MONTH_NAMES[mi]===endMonth && yr===endYear) break;
    mi++; if(mi>11){mi=0; yr++;}
    count++;
  }
  return months;
}

/* Paid-vs-used month model (Stage 1's "Show me the timeline", and anywhere else this
   comparison appears): no legend, no row labels — each caption sits directly above its
   own flush-left row of month boxes. Filled boxes get a tick, empty boxes a dash; both
   rows use the SAME neutral colour (never the prepaid/payable teal or orange — that
   would give the sort answer away before the student has classified the card). Fits
   the width and wraps on narrow screens; no inner scrollbar. */
/* Shared paid-vs-used axis: the union of an item's paid range, used range and the
   financial year end, so both rows (and any month either was paid or used) fit on one
   timeline. Reused by Stage 1's static hint and Stage 2 / Exit Ticket's interactive
   two-row strip below. */
function pvuAxis(ev){
  const axisStart = Math.min(monthIndex(ev.paidRange.start.m,ev.paidRange.start.y), monthIndex(ev.usedRange.start.m,ev.usedRange.start.y));
  const axisEnd = Math.max(monthIndex(ev.paidRange.end.m,ev.paidRange.end.y), monthIndex(ev.usedRange.end.m,ev.usedRange.end.y), monthIndex(FY_END.m,FY_END.y));
  const months = [];
  for(let i=axisStart;i<=axisEnd;i++){ months.push({month:MONTH_NAMES[((i%12)+12)%12], year:Math.floor(i/12)}); }
  return months;
}
function pvuInRange(mi, range){ return mi>=monthIndex(range.start.m,range.start.y) && mi<=monthIndex(range.end.m,range.end.y); }
function pvuStaticRowHTML(months, range){
  return months.map(mo=>{
    const mi = monthIndex(mo.month, mo.year);
    const active = pvuInRange(mi, range);
    const isYearEnd = mo.month==='Sep' && mo.year===2026;
    let html = `<span class="tl-box${active?' filled':''}${isYearEnd?' tl-yearend':''}">${mo.month} '${String(mo.year).slice(2)}<br>${active?'✓':'–'}</span>`;
    if(isYearEnd) html += `<span class="yearend-label">30 Sep</span>`;
    return html;
  }).join('');
}

function pvuModelHTML(ev){
  const months = pvuAxis(ev);
  const usedMonths = monthsSpan(ev.usedRange);
  return `
    <div class="tl-summary">Paid for: $${fmt(ev.paidInYear)} (${rangeLabelCompact(ev.paidRange)})</div>
    <div class="tl-row">${pvuStaticRowHTML(months, ev.paidRange)}</div>
    <div class="tl-summary">Used by 30 Sep: ${usedMonths} month${usedMonths===1?'':'s'} (${rangeLabelCompact(ev.usedRange)})</div>
    <div class="tl-row">${pvuStaticRowHTML(months, ev.usedRange)}</div>
  `;
}

   payable items alike. Fits the width, wraps on narrow screens, no inner scrollbar. */
function renderPaidUsedStrip(container, ev, storageKey){
  const months = pvuAxis(ev);
  const state = storage.get(storageKey, months.map(()=>false));
  const usedRowId = container.id + '-usedrow';
  container.innerHTML = `

    <div class="tl-summary" style="margin-top:14px;">Used by 30 Sep</div>
    <div class="tl-row" id="${usedRowId}"></div>
    <div class="month-counter"></div>
  `;
  const usedRow = container.querySelector('#'+CSS.escape(usedRowId));
  const counterEl = container.querySelector('.month-counter');
  usedRow.innerHTML = months.map((mo,i)=>{
    const isYearEnd = mo.month==='Sep' && mo.year===2026;
    let html = `<span class="tl-box tappable${isYearEnd?' tl-yearend':''}" data-i="${i}" tabindex="0" role="button" aria-pressed="false">${mo.month} '${String(mo.year).slice(2)}<br><span class="tl-mark"></span></span>`;
    if(isYearEnd) html += `<span class="yearend-label">30 Sep</span>`;
    return html;
  }).join('');
  function paint(){
    usedRow.querySelectorAll('.tl-box').forEach((box,i)=>{
      box.classList.toggle('filled', !!state[i]);
      box.querySelector('.tl-mark').textContent = state[i] ? '✓' : '–';
      box.setAttribute('aria-pressed', state[i]?'true':'false');
    });
    counterEl.textContent = `Months used by 30 Sep: ${state.filter(Boolean).length}`;
  }
  function toggle(i){ state[i]=!state[i]; storage.set(storageKey,state); paint(); }
  usedRow.querySelectorAll('.tl-box').forEach((box,i)=>{
    box.addEventListener('click', ()=>toggle(i));
    box.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(i); } });
  });
  paint();
}

/* Progressive reveal: renders blocks[0..revealed-1] into container, with a single
   trailing "Continue ↓" button that appends (not re-renders) the next block, so any
   live state in already-revealed blocks (e.g. check feedback) is never disturbed.
   Blocks are separated by a generous section gap. "Continue ↓" is always its own
   standalone, centred, outlined button — never "Next" (that label is reserved for the
   header button that moves between stages) and never merged into another button row. */
function initRevealStage(container, stageKey, blocks){
  let revealed = Math.min(Math.max(getRevealed(stageKey),1), blocks.length);
  let held = false;
  const ctrl = {
    revealedCount(){ return revealed; },
    /* A block's init can hide the Continue button until a condition is met (e.g. the
       Lesson 2 recall questions). Only the newest block can hold it. */
    hold(idx, isHeld){
      if(idx===revealed-1){ held = isHeld; renderNextBtn(); }
    },
    advance(){
      if(revealed>=blocks.length) return;
      const oldBtn = container.querySelector('.reveal-next-btn');
      if(oldBtn) oldBtn.remove();
      held = false;
      const idx = revealed;
      revealed++;
      const wrap = document.createElement('div');
      wrap.dataset.block = idx;
      wrap.className = 'section-gap';
      wrap.innerHTML = blocks[idx].html;
      container.appendChild(wrap);
      if(blocks[idx].init) blocks[idx].init(wrap, ctrl);
      setRevealed(stageKey, revealed);
      if(revealed>=blocks.length) markStageSeen(stageKey);
      renderNextBtn();
      wrap.scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
    }
  };
  function renderNextBtn(){
    const old = container.querySelector('.reveal-next-btn');
    if(old) old.remove();
    if(revealed<blocks.length && !held){
      const btn = document.createElement('button');
      btn.className = 'btn reveal-next-btn';
      btn.textContent = 'Continue ↓';
      btn.addEventListener('click', ()=> ctrl.advance());
      container.appendChild(btn);
    }
  }
  container.innerHTML = '';
  for(let i=0;i<revealed;i++){
    const wrap = document.createElement('div');
    wrap.dataset.block = i;
    if(i>0) wrap.className = 'section-gap';
    wrap.innerHTML = blocks[i].html;
    container.appendChild(wrap);
  }
  for(let i=0;i<revealed;i++){
    if(blocks[i].init) blocks[i].init(container.querySelector(`[data-block="${i}"]`), ctrl);
  }
  if(revealed>=blocks.length) markStageSeen(stageKey);
  renderNextBtn();
  return ctrl;
}

const App = { lesson:'l1', index:0 };

function stagesFor(lesson){ return {l1:STAGES_L1, l2:STAGES_L2, l3:STAGES_L3}[lesson] || STAGES_L1; }

function parseHash(){
  const m = /^#l([123])s(\d+)$/.exec(location.hash);
  if(!m) return {lesson:'l1', index:0};
  const lesson = 'l'+m[1];
  let index = parseInt(m[2],10);
  const stages = stagesFor(lesson);
  if(isNaN(index) || index<0 || index>=stages.length) index=0;
  if(!isStageUnlocked(lesson, index)) index = Math.min(getUnlockedUpTo(lesson), stages.length-1);
  return {lesson, index};
}

function navigateTo(lesson, index){
  const stages = stagesFor(lesson);
  index = Math.max(0, Math.min(stages.length-1, index));
  if(!isStageUnlocked(lesson, index)){ showLockMsg(); return; }
  const hash = `#${lesson}s${index}`;
  if(location.hash===hash){ App.lesson=lesson; App.index=index; renderApp(); }
  else { location.hash = hash; }
}

  const p = parseHash();
  App.lesson = p.lesson; App.index = p.index;
  renderApp();
});

function renderApp(){
  closeInfo();
  const stages = stagesFor(App.lesson);
  const stage = stages[App.index];

  document.querySelectorAll('#lessonSwitch button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lesson===App.lesson);
  });

  const track = document.getElementById('stepTrack');
  track.innerHTML = stages.map((s,i)=>{
    const unlocked = isStageUnlocked(App.lesson, i);
    return `<button class="step-tab ${i===App.index?'active':''} ${unlocked?'':'locked'}" data-i="${i}">${unlocked?'':LOCK_ICON}${esc(s.label)}</button>`;
  }).join('');
  track.querySelectorAll('.step-tab').forEach(btn=>{
    btn.addEventListener('click', ()=> navigateTo(App.lesson, parseInt(btn.dataset.i,10)));
  });

  document.getElementById('backBtn').disabled = App.index===0;
  document.getElementById('nextBtn').disabled = App.index===stages.length-1 || !isStageUnlocked(App.lesson, App.index+1);

  const chipsHTML = [
    stage.time ? `<span class="chip">${esc(stage.time)}</span>` : '',
    stage.grouping ? `<span class="chip group">${esc(stage.grouping)}</span>` : ''
  ].join('');

  const content = document.getElementById('stageContent');
  content.innerHTML = (chipsHTML ? `<div class="stage-header"><div class="chips">${chipsHTML}</div></div>` : '<div class="stage-header"></div>')
    + `<div id="stageBody"></div>`;
  stage.render(document.getElementById('stageBody'));

  const clearLink = document.createElement('button');
  clearLink.type = 'button';
  clearLink.className = 'clear-link';
  clearLink.textContent = 'Clear my answers';
  clearLink.addEventListener('click', ()=>{
    clearStageAnswers(stage.storeKey);
    stage.render(document.getElementById('stageBody'));
  });
  content.appendChild(clearLink);

  window.scrollTo(0,0);
}

/* Lightweight refresh of just the tab lock states and Next button, called when a stage
   unlocks mid-page (e.g. the last Continue is opened) so progression updates immediately
   without re-rendering the stage content the student is working in. */
function refreshStepperUI(){
  const stages = stagesFor(App.lesson);
  const track = document.getElementById('stepTrack');
  if(track){
    track.querySelectorAll('.step-tab').forEach((btn,i)=>{
      const unlocked = isStageUnlocked(App.lesson, i);
      btn.classList.toggle('locked', !unlocked);
      btn.innerHTML = `${unlocked?'':LOCK_ICON}${esc(stages[i].label)}`;
    });
  }
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.disabled = App.index===stages.length-1 || !isStageUnlocked(App.lesson, App.index+1);
}

/* ---- "Check my answers" — nothing is checked before this is pressed. Every blank, dropdown and MCQ gets a tick or cross, and the wrong ones list
   their specific feedback underneath. ---- */
function setMark(el, correct){
  let mark = el.nextElementSibling;
  if(!mark || !mark.classList || !mark.classList.contains('fb-icon')){
    mark = document.createElement('span');
    mark.className = 'fb-icon';
    el.insertAdjacentElement('afterend', mark);
  }
  mark.textContent = correct ? '✓' : '✗';
  mark.className = 'fb-icon ' + (correct?'correct':'wrong');
  el.classList.toggle('correct', correct);
  el.classList.toggle('wrong', !correct);
}

function checkExitBlank(container, key, spec, wrongList){
  const input = container.querySelector(`[data-key="${key}"]`);
  if(!input) return;
  const parsed = parseAmount(input.value);
  const correct = parsed!==null && Math.round(parsed*100)===Math.round(spec.expected*100);
  setMark(input, correct);
  if(!correct){
    const wkey = parsed===null? null : Math.round(parsed);
    wrongList.push((wkey!==null && spec.wrong && spec.wrong[wkey]) ? spec.wrong[wkey] : spec.generic);
  }
}

function checkExitSelect(container, key, spec, wrongList){
  const select = container.querySelector(`[data-key="${key}"]`);
  if(!select) return;
  const val = select.value;
  const correct = val === spec.expected;
  setMark(select, correct);
  if(!correct){
    wrongList.push((spec.wrong && spec.wrong[val]) ? spec.wrong[val] : spec.generic);
  }
}

/* Item 3(a) is checked live (no button): as soon as both dropdowns are filled, check
   immediately. Correct reveals (b) and (c) below, one-way (it stays revealed even if
   the student later changes (a) to something wrong). */
function checkTheoryALive(container){
  const s1 = container.querySelector('[data-key="theory1"]');
  const s2 = container.querySelector('[data-key="theory2"]');
  const fb = container.querySelector('#theory-a-feedback');
  const bc = container.querySelector('#theory-bc');
  const v1 = s1.value, v2 = s2.value;
  let correct = false;
  if(!v1 || !v2){
    fb.innerHTML = '';
  } else {
    correct = v1!==v2 && THEORY_A_CORRECT.includes(v1) && THEORY_A_CORRECT.includes(v2);
    setMark(s1, correct);
    setMark(s2, correct);
    if(correct){
      fb.innerHTML = `<div class="card-feedback show correct">✓ Yes: those are the two rules behind today's work.</div>`;
      storage.set(`yecf.${EXIT1_KEY}.theoryBcUnlocked`, true);
    } else {
      let msg;
      if(v1===v2) msg = "You've picked the same theory twice. Which other rule was in your thought bubble at the Case Debrief?";
      else if(v1==='Revenue recognition theory' || v2==='Revenue recognition theory') msg = "Revenue recognition theory is about when INCOME is recorded. Today was about expenses.";
      else if(v1==='Accounting period theory' || v2==='Accounting period theory') msg = "The accounting period gives us the 30 Sep year end. But which theory says September's electricity belongs to this year even though it's paid on 31 Oct 2026?";
      else msg = "Does this theory explain why the gym subscription expense is $800 and not the $2 400 paid?";
      fb.innerHTML = `<div class="card-feedback show incorrect">✗ ${msg}</div>`;
    }
  }
  /* correct now (works even if storage is blocked) or unlocked earlier in a working
     session (one-way: a later wrong edit to (a) does not re-hide (b) and (c)). */
  if(bc && (correct || storage.get(`yecf.${EXIT1_KEY}.theoryBcUnlocked`, false))) bc.style.display = '';
}

function htmlToText(html){
  const t = html.replace(/\s*\n\s*/g, ' ')
    .replace(/<\/(p|h\d|div|tr|li)>/gi, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(td|th)>/gi, ' | ')
    .replace(/<[^>]+>/g, '');
  const ta = document.createElement('textarea'); ta.innerHTML = t;
  return ta.value.replace(/ \| \n/g, '\n').replace(/\n{3,}/g, '\n\n').replace(/[ \t]+\n/g, '\n').trim();
}

/* Copy as formatted HTML plus plain text. Order: async clipboard (both formats) ->
   copy of a rendered selection (keeps formatting) -> plain text only. false = blocked. */
async function copyReportToClipboard(html, text){
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}), 'text/plain':new Blob([text],{type:'text/plain'})})]);
      return true;
    }
  }catch(e){}
  try{
    const tmp = document.createElement('div');
    tmp.style.cssText = 'position:fixed; left:-9999px; top:0; width:700px; background:#fff;';
    tmp.innerHTML = html; document.body.appendChild(tmp);
    const range = document.createRange(); range.selectNodeContents(tmp);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    const ok = document.execCommand('copy');
    sel.removeAllRanges(); tmp.remove();
    if(ok) return true;
  }catch(e){}
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  return false;
}

function reportSummary(rec, results){
  const total = rec.total, n = Object.values(rec.first).filter(Boolean).length;
  const m = results.filter(r=>r.ok).length;
  if(rec.allAt===1) return 'All correct on check 1';
  return `First check: ${n} of ${total} correct · Checks: ${rec.checks} · ` + (rec.allAt && m===total ? `All correct on check ${rec.allAt}` : `Now: ${m} of ${total} correct`);
}

/* Standard report body: one row per checked answer (question, answer, now, first try). */

  });
  return `<table border="1" cellpadding="6" style="border-collapse:collapse; border:1px solid #000;">

function initCheckCopy(container, cfg){
  const $ = s=> container.querySelector(s);
  const checkBtn = $('[data-cc="check"]'), note = $('[data-cc="note"]'), line = $('[data-cc="line"]'),
        copyBtn = $('[data-cc="copy"]'), copyNote = $('[data-cc="copynote"]'), msg = $('[data-cc="msg"]'), fb = $('[data-cc="fallback"]');
  const nameEl = $('#who-name'), classEl = $('#who-class');
  nameEl.value = storage.get('yecf.who.name', ''); classEl.value = storage.get('yecf.who.class', '');
  nameEl.addEventListener('input', ()=>{ storage.set('yecf.who.name', nameEl.value); refresh(); });
  classEl.addEventListener('input', ()=> storage.set('yecf.who.class', classEl.value));

  // Confidence check (not marked): saved per criterion
  container.querySelectorAll('[data-conf]').forEach(row=>{
    const key = `yecf.${cfg.storeKey}.conf.${row.dataset.conf}`;
    const paint = v=> row.querySelectorAll('button').forEach(b=> b.classList.toggle('selected', String(b.dataset.n)===String(v)));
    paint(storage.get(key, null));
    row.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ storage.set(key, +b.dataset.n); paint(b.dataset.n); refresh(); }));
  });
  const allRated = ()=> [...container.querySelectorAll('[data-conf]')].every(r=> r.querySelector('button.selected'));
  let checkedHere = false;   // the "Now: ..." part only shows once the student has checked in this view (not after Clear my answers or a reload)

  function refresh(){
    const ready = cfg.isReady();
    checkBtn.disabled = !ready;
    note.style.display = ready ? 'none' : '';
    const rec = getRec(cfg.storeKey);
    if(rec && rec.first){
      const n = Object.values(rec.first).filter(Boolean).length;
      line.textContent = `First check: ${n} of ${rec.total} correct` + (rec.checks>1 && checkedHere ? ` · Now: ${rec.lastOk} of ${rec.total} correct · Checks: ${rec.checks}` : '');
    } else line.textContent = '';
    const hasName = nameEl.value.trim()!=='';
    const canCopy = hasName && allRated();
    copyBtn.disabled = !(rec && rec.first && canCopy);
    copyNote.textContent = (rec && rec.first && !canCopy) ? 'Enter your name and rate your confidence first.' : '';
  }

  checkBtn.addEventListener('click', ()=>{
    const results = cfg.runCheck();
    let rec = getRec(cfg.storeKey) || {first:null, total:results.length, checks:0, allAt:null, lastOk:0};
    rec.checks += 1; checkedHere = true;
    if(!rec.first){ rec.first = {}; results.forEach(r=> rec.first[r.id] = !!r.ok); rec.total = results.length; if(cfg.captureFirst) rec.extra = cfg.captureFirst(); }   // recorded once, never changed
    rec.lastOk = results.filter(r=>r.ok).length;
    if(!rec.allAt && rec.lastOk===results.length) rec.allAt = rec.checks;
    setRec(cfg.storeKey, rec);
    msg.textContent = ''; fb.innerHTML = '';
    refresh();
  });

  copyBtn.addEventListener('click', async ()=>{
    const rec = getRec(cfg.storeKey);
    if(!rec || !rec.first) return;
    const {html, text} = buildReport(cfg, container, rec, cfg.evaluate());
    msg.textContent = ''; fb.innerHTML = '';
    const ok = await copyReportToClipboard(html, text);
    if(ok){
      msg.style.color = 'var(--correct)';
      msg.textContent = 'Copied! Now paste it into your Google Doc for this lesson (Ctrl+V, or tap and hold, then Paste), then turn it in on Google Classroom.';
    } else {
      msg.style.color = '';
      msg.textContent = '';
      fb.innerHTML = `<div class="report-box" tabindex="0" aria-label="Your report">${html}</div>
        <div class="btnrow" style="margin-top:12px;"><button type="button" class="btn btn-primary" data-cc="selectall">Select all</button></div>
        <div class="instruct" style="margin-top:8px;">Press Ctrl+C (or tap and hold, then Copy)</div>`;
      fb.querySelector('[data-cc="selectall"]').addEventListener('click', ()=>{
        const box = fb.querySelector('.report-box');
        const range = document.createRange(); range.selectNodeContents(box);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); box.focus();
      });
    }
  });

  refresh();
  return {refresh};
}

const EXIT_LABELS = {
  adv: ['Amount paid ($)','Months paid for','Cost per month working: amount ($)','Cost per month working: months','Cost per month ($)','Months used by 30 Sep','Expense working: cost per month ($)','Expense working: months used','Advertising expense for the year ended 30 Sep 2026 ($)','Months not used yet','Prepaid working: cost per month ($)','Prepaid working: months not used','Prepaid advertising expense as at 30 Sep 2026 ($)'],
  clean: ['Cost per month ($)','Months paid for','Paid working: cost per month ($)','Paid working: months','Amount paid ($)','Months used but not paid','Payable working: cost per month ($)','Payable working: months owed','Cleaning service expense payable as at 30 Sep 2026 ($)','Expense working: amount paid ($)','Expense working: amount still owed ($)','Cleaning service expense for the year ended 30 Sep 2026 ($)']
};
function blankTail(template, n){
  const part = template.split('___')[n].replace(/<[^>]+>/g,'');
  const words = part.trim().split(/\s+/).filter(Boolean);
  return (words.length>6 ? '…' : '') + words.slice(-6).join(' ');
}
function exitSpec(container){
  const val = key=> (container.querySelector(`[data-key="${key}"]`)||{value:''}).value.trim();
  const items = [];
  const advT = EXIT_TEMPLATES.adv, cleanT = EXIT_TEMPLATES.clean;
  const add = (group,id,label,answer,ok)=> items.push({group,id,label,answer,ok});
  const blanks = (group, prefix, tpl, specs)=> specs.forEach((spec,i)=>{
    const v = val(`${prefix}-${i}`), n = parseAmount(v);
    add(group, `${prefix}-${i}`, EXIT_LABELS[prefix][i], v, n!==null && Math.round(n*100)===Math.round(spec.expected*100));
  });
  const drops = (group, prefix)=>{
    const t = EXIT_DROPDOWN_FIELDS[`${prefix}-seltype`], r = EXIT_DROPDOWN_FIELDS[`${prefix}-selreason`];
    add(group, `${prefix}-seltype`, 'Prepaid expense or expense payable?', val(`${prefix}-seltype`), val(`${prefix}-seltype`)===t.expected);
    add(group, `${prefix}-selreason`, 'Reason: by 30 September 2026, the company…', val(`${prefix}-selreason`), val(`${prefix}-selreason`)===r.expected);
  };
  blanks('Item 1: Advertising','adv',advT,EXIT_ADV_FIELDS); drops('Item 1: Advertising','adv');
  blanks('Item 2: Cleaning service expense','clean',cleanT,EXIT_CLEAN_FIELDS); drops('Item 2: Cleaning service expense','clean');
  const t1 = val('theory1'), t2 = val('theory2');
  const aOk = !!t1 && !!t2 && t1!==t2 && THEORY_A_CORRECT.includes(t1) && THEORY_A_CORRECT.includes(t2);
  add('Item 3: The rules behind it','theory1','(a) Theory 1',t1,aOk);
  add('Item 3: The rules behind it','theory2','(a) Theory 2',t2,aOk);
  const mcq = name=> { const c = container.querySelector(`input[name="${name}"]:checked`); return c ? c.value : ''; };
  add('Item 3: The rules behind it','theoryB','(b) The Accrual Basis of Accounting',mcq('theoryB'),mcq('theoryB')===THEORY_B_EXPECTED);
  add('Item 3: The rules behind it','theoryC','(c) Matching theory',mcq('theoryC'),mcq('theoryC')===THEORY_C_EXPECTED);
  return items;
}

/* Textbook ledger (Date, Particulars, Dr $, Cr $, Balance $). The year sits on its own row;
   each numbered line gets a small (1), (2) tag; a working such as ($300 × 11) goes in
   brackets in the Particulars text, right after the account name. rows: {y} for a year row,
   else {d, p, dr, cr, bal}. opts.bare returns just the table (for Manual pages). */
function ledgerHTML(title, rows, opts){
  let n = 0;
  /* Lesson 3 worked examples: a row's `m` adds an italic "What it means" column (a line under
     each ledger line on phones). */
  const hasM = rows.some(r=>r.m);
  const body = rows.map(r=>{
    if(r.y) return `<tr class="yr"><td>${r.y}</td><td></td><td class="num"></td><td class="num"></td><td class="num"></td>${hasM?'<td class="mean-col"></td>':''}</tr>`;
    n++;
    const amt = v => v ? `<span style="white-space:nowrap;">${v}</span>` : '';
    return `<tr><td style="white-space:nowrap;">${r.d}</td>
      <td>${r.noref?'':`<span class="ref">(${n})</span>`}${r.p}</td>
      <td class="num">${amt(r.dr)}</td><td class="num">${amt(r.cr)}</td><td class="num" style="white-space:nowrap;">${r.bal}</td>${hasM?`<td class="mean-col">${r.m}</td>`:''}</tr>`
      + (hasM ? `<tr class="mean-row"><td colspan="5" class="mean">${r.m}</td></tr>` : '');
  }).join('');
  const table = `<div class="scroll-x"><table class="ledger">
    <tr><th>Date</th><th>Particulars</th><th class="num">Dr $</th><th class="num">Cr $</th><th class="num">Balance $</th>${hasM?'<th class="mean-col">What it means</th>':''}</tr>
    ${body}</table></div>`;
  return (opts && opts.bare) ? table : `<div class="ledger-card"><h4>${title}</h4>${table}</div>`;
}

/* Tap-to-check multiple choice. Each q: {id, lead, q, opts:[{t, fb, ok}]}. Options keep
   the order written in the storyboard. A wrong tap shows that option's own feedback; the
   second wrong tap on the same question adds the Manual pointer. Selections are saved
   under yecf.<storeKey>.mcq.<id>. */
function mcqHTML(list){
  return list.map(q=>`<div class="mcq-q" data-mcq="${q.id}">
    <p>${q.lead?`<b>${q.lead}</b> `:''}${q.q}</p>
    <div class="mcq-group">${q.opts.map((o,i)=>`<label class="mcq-option"><input type="radio" name="${q.id}" value="${i}"><span>${o.t}</span></label>`).join('')}</div>
    <div class="card-feedback" aria-live="polite"></div>
  </div>`).join('');
}

function initMcqs(el, storeKey, list, onChange, pointer){
  pointer = pointer || WRONG_TWICE;   // Lesson 3 passes L3_POINTER
  /* Current choices are kept in memory too, so checking still works with storage blocked. */
  const chosen = {};
  list.forEach(q=>{ chosen[q.id] = storage.get(`yecf.${storeKey}.mcq.${q.id}`, null); });
  const isRight = q=> chosen[q.id]!==null && !!q.opts[chosen[q.id]] && !!q.opts[chosen[q.id]].ok;
  list.forEach(q=>{
    const wrap = el.querySelector(`[data-mcq="${q.id}"]`);
    const fb = wrap.querySelector('.card-feedback');
    const show = (i)=>{
      const o = q.opts[i];
      let msg = o.fb;
      if(!o.ok && getAttempts(storeKey, 'mcq-'+q.id)>=2) msg += pointer;
      fb.className = 'card-feedback show ' + (o.ok?'correct':'incorrect');
      fb.textContent = (o.ok?'✓ ':'✗ ') + msg;
    };
    const saved = storage.get(`yecf.${storeKey}.mcq.${q.id}`, null);
    if(saved!==null && q.opts[saved]){
      wrap.querySelector(`input[value="${saved}"]`).checked = true;
      show(saved);
    }
    wrap.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const i = parseInt(inp.value,10);
        chosen[q.id] = i;
        storage.set(`yecf.${storeKey}.mcq.${q.id}`, i);
        if(q.opts[i].ok) setAttempts(storeKey, 'mcq-'+q.id, 0);
        else setAttempts(storeKey, 'mcq-'+q.id, getAttempts(storeKey, 'mcq-'+q.id)+1);
        show(i);
        if(onChange) onChange(list.every(isRight));
      });
    });
  });
  return ()=> list.every(isRight);
}

function claimSentenceHTML(c){
  const withInputs = blanksToInputs('s3-'+c.key, c.tpl);
  return `<div class="frame" style="margin-bottom:12px;">${withInputs.replace('SEL', blankSelect('s3-'+c.key, 'type', ['prepaid expense','expense payable']))}</div>
    <div id="s3-fb-${c.key}" style="margin-bottom:24px;"></div>`;
}

function checkS3Claims(el){
  S3_CLAIMS.forEach(c=>{
    const wrongList = [];
    const prefix = 's3-'+c.key;
    const bump = (id, correct)=>{
      if(correct){ setAttempts('l2-s3', id, 0); return ''; }
      const n = getAttempts('l2-s3', id)+1; setAttempts('l2-s3', id, n);
      return n>=2 ? WRONG_TWICE : '';
    };
    c.fields.forEach((f,i)=>{
      const input = el.querySelector(`[data-key="${prefix}-${i}"]`);
      const parsed = parseAmount(input.value);
      const ok = parsed!==null && Math.round(parsed)===f.expected;
      setMark(input, ok);
      const extra = bump(`${prefix}-${i}`, ok);
      if(ok) return;
      let msg;
      if(i===0) msg = `Look at Jay's closing entry for ${c.name.toLowerCase()}. What amount is he planning to transfer to the Income Summary?`;
      else msg = (parsed!==null && f.wrong[Math.round(parsed)]) || f.generic;
      wrongList.push(msg + extra);
    });
    const sel = el.querySelector(`[data-key="${prefix}-seltype"]`);
    const ok = sel.value === c.type.expected;
    setMark(sel, ok);
    const extra = bump(`${prefix}-type`, ok);
    if(!ok) wrongList.push(((sel.value && c.type.wrong[sel.value]) || c.type.generic) + extra);
    renderWrongList(el.querySelector(`#s3-fb-${c.key}`), wrongList);
  });
}

/* Journal table (Date, Particulars, Dr $, Cr $). rows: {y}, {d, p, dr, cr, indent}, {note} or {blank}. */
function journalHTML(rows){
  const body = rows.map(r=>{
    if(r.y) return `<tr class="yr"><td>${r.y}</td><td></td><td class="num"></td><td class="num"></td></tr>`;
    if(r.blank) return `<tr><td colspan="4" style="height:10px; padding:0; border-bottom:none;"></td></tr>`;
    if(r.note) return `<tr><td></td><td colspan="3"><i>${r.note}</i></td></tr>`;
    return `<tr><td style="white-space:nowrap;">${r.d||''}</td>
      <td style="${r.indent?'padding-left:28px;':''}">${r.p}</td>
      <td class="num">${r.dr||''}</td><td class="num">${r.cr||''}</td></tr>`;
  }).join('');
  return `<div class="scroll-x"><table class="ledger">
    <tr><th>Date</th><th>Particulars</th><th class="num">Dr $</th><th class="num">Cr $</th></tr>${body}</table></div>`;
}

/* Small "what's left in the account" table: rows of [label, amount]; the last row is the total. */
function miniTableHTML(rows){
  return `<div class="scroll-x"><table class="ledger mini"><tr><th></th><th class="num">$</th></tr>${rows.map((r,i)=>`<tr${i===rows.length-1?' class="yr"':''}><td>${r[0]}</td><td class="num">${r[1]}</td></tr>`).join('')}</table></div>`;
}

/* Worked example page (Accounting Manual): the question, then step by step, each journal
   entry directly under its own step, and the ledger last, for reference only. */
function manualPageHTML(o){
  const chips = arr => (arr||[]).map(l=>`<div class="calc-chip">${l}</div>`).join('');
  return `<div class="manual-page">
    <div class="manual-tag">WORKED EXAMPLE</div>
    <div class="manual-header">Accounting Manual · p.${o.page}</div>
    <h3>${o.heading}</h3>

      ${s.text?`<p>${s.text}</p>`:''}${chips(s.chips)}${s.table?miniTableHTML(s.table):''}${s.after?`<p>${s.after}</p>`:''}${s.journal?journalHTML(s.journal):''}`).join('')}

}

/* ============================== COMPARE HINTS (ⓘ) ==============================
   A small ⓘ button opens ONE shared rounded box. It opens on tap or click (so it works on
   iPads and Chromebooks) and also on hover with a mouse; it closes on a second tap, a tap
   elsewhere, or Esc. Content comes from INFO_PROVIDERS[key](button) when it opens, so a hint
   can show the student's own typed figure. */
const INFO_PROVIDERS = {};
function infoBtn(key){
  return `<button type="button" class="info-btn" data-info="${key}" aria-label="Compare" aria-expanded="false">ⓘ</button>`;
}
let closeInfo = ()=>{};
(function setupInfoHints(){
  let box = null, current = null, pinned = false;
  const ensure = ()=>{
    if(!box){ box = document.createElement('div'); box.className = 'info-box'; box.setAttribute('role','note'); box.hidden = true; document.body.appendChild(box); }
    return box;
  };
  const position = btn=>{
    const r = btn.getBoundingClientRect();
    const bw = Math.min(340, window.innerWidth-16);
    box.style.width = bw+'px';
    box.style.left = Math.min(Math.max(8, r.left-8), window.innerWidth-bw-8)+'px';
    box.style.top = (r.bottom+8)+'px';
    const bh = box.offsetHeight;
    if(r.bottom+8+bh > window.innerHeight-8 && r.top-8-bh > 8) box.style.top = (r.top-8-bh)+'px';
  };
  const close = ()=>{
    if(box) box.hidden = true;
    if(current) current.setAttribute('aria-expanded','false');
    current = null; pinned = false;
  };
  const open = btn=>{
    const provider = INFO_PROVIDERS[btn.dataset.info];
    if(!provider) return;
    const b = ensure();
    if(current && current!==btn) current.setAttribute('aria-expanded','false');
    b.innerHTML = provider(btn);
    b.hidden = false;
    current = btn; btn.setAttribute('aria-expanded','true');
    position(btn);
  };
  closeInfo = close;
  document.addEventListener('click', e=>{
    const btn = e.target.closest('.info-btn');
    if(btn){
      e.preventDefault();
      if(current===btn && pinned) close(); else { open(btn); pinned = true; }
      return;
    }
    if(box && !box.hidden && !box.contains(e.target)) close();
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && current){ const b = current; close(); b.focus(); }
  });
  if(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches){
    document.addEventListener('mouseover', e=>{ const btn = e.target.closest('.info-btn'); if(btn && !pinned && current!==btn) open(btn); });
    document.addEventListener('mouseout', e=>{ const btn = e.target.closest('.info-btn'); if(btn && !pinned && current===btn) close(); });
  }
  window.addEventListener('scroll', ()=>{ if(current) position(current); }, true);
  window.addEventListener('resize', ()=>{ if(current) position(current); });
})();

function checkStatements(el){
  const perf = [], pos = [];
  const chk = (list, k, expected, msgFn)=>{
    const input = el.querySelector(`[data-key="s5-${k}"]`);
    const n = parseAmount(input.value);
    const ok = n!==null && Math.round(n)===expected;
    setMark(input, ok);
    const extra = s5Bump('s5-'+k, ok);
    if(!ok) list.push(msgFn(n) + extra);
    return ok;
  };
  let itemsRight = true;
  S5_EXP.forEach(x=>{
    const ok = chk(perf, 'e-'+x.k, x.ans, n=>{
      if(n===x.jay) return `That's Jay's cash figure. What's the ${x.item} expense for the year ended 30 Sep 2026 in your case file?`;
      if(x.k==='gym' && n===1600) return "$1 600 is the unused part. Does that belong in this year's expenses, or in the Statement of Financial Position?";
      if(x.k==='util' && n===300) return "$300 is only September's unpaid bill. What's the full utilities expense for the year?";
      return `Check your ${x.item} expense against the case file.`;
    });
    itemsRight = itemsRight && ok;
  });
  const totalMsg = ()=> itemsRight ? 'Your items are right. Add them again, then take the total from the service fee revenue.' : 'Get the four expenses right first, then add them up.';
  chk(perf, 'e-total', 27050, totalMsg);

  S5_LIAB.forEach(x=>{

function memoBump(id, ok){
  if(ok){ setAttempts(MEMO_KEY, id, 0); return ''; }
  const n = getAttempts(MEMO_KEY, id)+1; setAttempts(MEMO_KEY, id, n);
  return n>=2 ? WRONG_TWICE : '';
}

/* Pure: current result of every blank (no marking, no feedback). */
function evaluateMemo(el){
  return Object.keys(M_FIELDS).map(id=>({id, ok: memoOk(id, el.querySelector(`[data-key="m-${id}"]`).value)}));
}

function checkMemo(el){
  const lists = {sw:[], dv:[], why:[]};
  const el_ = id => el.querySelector(`[data-key="m-${id}"]`);
  const swapped = {sw:false, dv:false};
  ['sw','dv'].forEach(p=>{
    const s = M_FIELDS[p+'-drA'].ans, c = M_FIELDS[p+'-crA'].ans;
    swapped[p] = el_(p+'-drA').value===c && el_(p+'-crA').value===s;
  });
  const swapMsg = {sw:"The unused software (an asset) goes up. Which side does an asset going up go on?", dv:"The company owes $400 more. Which side does a liability going up go on?"};
  const seen = new Set();
  Object.keys(M_FIELDS).forEach(id=>{
    const f = M_FIELDS[id]; const input = el_(id); const p = id.split('-')[0];
    const isNum = typeof f.ans==='number';
    const v = isNum ? parseAmount(input.value) : input.value;
    const ok = memoOk(id, input.value);
    setMark(input, ok);
    const extra = memoBump('m-'+id, ok);
    if(ok) return;
    let msg;
    if((id.endsWith('drA')||id.endsWith('crA')) && swapped[p]) msg = swapMsg[p];
    else msg = (f.wrong && f.wrong[isNum? (v===null?'':Math.round(v)) : v]) || f.generic;
    const key = p+'|'+msg;
    if(seen.has(key)) return; seen.add(key);
    lists[p].push(msg + extra);
  });
  ['sw','dv','why'].forEach(p=> renderWrongList(el.querySelector('#memo-fb-'+p), lists[p]));
}

   {s:id:KEY} dropdown (options in L3_OPTS). `f` holds the checked fields: F(answer, message,

function l3Tokens(item, tpl){
  /* The final "." stays glued to the last blank (and its "$") so it never wraps onto its own line. */
  tpl = tpl.replace(/(\$?\{[nts]:\w+(?::\w+)?\}\.)$/, '<span class="nw">$1</span>');
  return tpl.replace(/\{(n|t|s):(\w+)(?::(\w+))?\}/g, (m, kind, id, opt)=>{
    const key = `l3-${item}-${id}`;
    if(kind==='n') return `<input class="fb" type="text" inputmode="decimal" data-key="${key}" autocomplete="off" aria-label="${id}">`;
    if(kind==='t') return `<input class="fb wide" type="text" data-key="${key}" autocomplete="off" aria-label="${id}">`;
    return `<select class="fb-select" data-key="${key}" aria-label="${id}"><option value=""></option>${L3_OPTS[opt].map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
  });
}
/* The sentences of one item, then (optionally) a Check button and the feedback area. */
function l3PartsHTML(item, from, opts){
  opts = opts || {};
  const parts = L3_ITEMS[item].parts.slice(from||0);
  return parts.map(p=>`<div class="frame" style="margin-bottom:12px;"><b>${p.lead}</b> ${l3Tokens(item, p.tpl)}</div>`).join('')
    + (opts.noCheck ? `<div id="l3fb-${item}"></div>` : `<div class="btnrow" style="margin-top:20px;"><button class="btn btn-primary" data-l3check="${item}">Check</button></div><div id="l3fb-${item}" style="margin-top:12px;"></div>`);
}
function l3ItemHTML(item, from){
  const it = L3_ITEMS[item];
  return ledgerHTML(it.title, it.rows) + l3PartsHTML(item, from);
}
function l3Fields(item){
  const out = [];
  L3_ITEMS[item].parts.forEach(p=> Object.keys(p.f||{}).forEach(id=> out.push({id, def:p.f[id], seq:p.seq||null, lab:p.lead.match(/^\S+/)[0]})));
  return out;
}
/* Pure: the current result of every checked field of an item. */
function l3Eval(root, item){
  return l3Fields(item).map(({id, def, seq, lab})=>{
    const el = root.querySelector(`[data-key="l3-${item}-${id}"]`);
    const raw = el ? el.value : '';
    let ok;
    if(typeof def.ans==='number'){ const n = parseAmount(raw); ok = n!==null && Math.round(n*100)===def.ans*100; }
    else ok = raw===def.ans;
    return {id: `${item}-${id}`, el, raw, def, ok, seq, lab};
  });
}
/* Pure: one result per question. A statement sentence (three dropdowns) is ONE question: right
   only when all three blanks are right. `answers` lists the student's choices in order. */
function l3Merged(root, item){
  const out = [], seen = {};
  l3Eval(root, item).forEach(r=>{
    if(!r.seq){ out.push({id:r.id, ok:r.ok, answers:[r.raw]}); return; }
    const gid = `${item}-${r.seq}`;
    if(!seen[gid]){ seen[gid] = {id:gid, ok:true, answers:[]}; out.push(seen[gid]); }
    seen[gid].ok = seen[gid].ok && r.ok; seen[gid].answers.push(r.raw);
  });
  return out;
}
/* Marks the fields and returns the item-specific messages. In a statement sentence only the
   first wrong blank (name, statement, amount) gives feedback. */
function l3Mark(root, item, storeKey){
  const res = l3Eval(root, item), msgs = [], done = {};
  /* An empty blank or dropdown: nothing is marked and no attempt is counted (Lesson 3 rules). */
  if(res.some(r=> r.raw.trim()==='')) return {res, msgs:[], attempts:0, empty:true};
  res.forEach(r=>{
    if(r.el) setMark(r.el, r.ok);
    if(r.ok) return;
    if(r.seq){ if(done[r.seq]) return; done[r.seq] = true; }
    const n = typeof r.def.ans==='number' ? parseAmount(r.raw) : null;
    const m = r.lab + ' ' + ((n!==null && r.def.wrong[Math.round(n)]) || r.def.msg);   // each line starts with its question label
    if(!msgs.includes(m)) msgs.push(m);
  });
  const attempts = msgs.length ? getAttempts(storeKey, 'l3-'+item)+1 : 0;
  setAttempts(storeKey, 'l3-'+item, attempts);
  return {res, msgs, attempts};
}
const DECODER_LINE = L3_POINTER.trim();   // added once at the end of the list from the second try
function initL3Item(el, item, storeKey){
  const btn = el.querySelector(`[data-l3check="${item}"]`);
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    const {msgs, attempts, empty} = l3Mark(el, item, storeKey);
    const out = el.querySelector(`#l3fb-${item}`);
    if(empty){ out.innerHTML = '<div class="card-feedback show incorrect">Fill in every blank first.</div>'; return; }
    if(attempts>=2) msgs.push(DECODER_LINE);
    renderWrongList(out, msgs);
  });
}
