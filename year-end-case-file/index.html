function initModelReveal(el, boxSel, btnSel, outSel, storeKey, modelKey){
  const boxes = [...el.querySelectorAll(boxSel)], btn = el.querySelector(btnSel), out = el.querySelector(outSel);
  const flag = `yecf.${storeKey}.model.${modelKey}`;
  const show = ()=>{ out.style.display = ''; btn.disabled = true; };
  const refresh = ()=>{ if(out.style.display==='none') btn.disabled = !boxes.every(b=>b.value.trim()!==''); };
  boxes.forEach(b=> b.addEventListener('input', refresh));
  btn.addEventListener('click', ()=>{ show(); storage.set(flag, true); });
  if(storage.get(flag, false)) show(); else refresh();
}
function checklistHTML(text){
  return `<p style="margin-top:12px;"><b>Check yours:</b> ${text}</p>`;
}
const box = t => `<label style="display:inline-block; max-width:100%; margin-right:8px;"><input type="checkbox" autocomplete="off"> ${t}</label>`;
/* Typed blanks (CLAUDE.md): at least 22 characters wide for words and 8 for amounts, growing as the
   student types, and never wider than the line (they wrap to the next line on narrow screens). */
const wordBox = (item, id, label, min) => `<input class="fb grow" data-min="${min||22}" type="text" data-key="l3-${item}-${id}" autocomplete="off" aria-label="${label}">`;
const amtBox = (item, id, label) => wordBox(item, id, label, 8);
function initGrow(root){
  root.querySelectorAll("input.grow").forEach(i=>{
    const fit = ()=>{ i.style.width = Math.max(+i.dataset.min, i.value.length + 1) + "ch"; };
    fit(); i.addEventListener("input", fit);
  });
}

function renderL3Stage8(container){
  const partB = L3_ITEMS.hosting, partC = L3_ITEMS.security;
  const blocks = [
    { html: decoderPanelHTML()
        + `<div class="instruct">Here's a ledger from our senior accountant. Complete each sentence, then check.</div>`
        + l3ItemHTML('repairs'),
      init(el){ initExitBlanks(el, S8_KEY); initL3Item(el, 'repairs', S8_KEY); } },
    { html: `<div class="instruct">This time, type the missing words and amounts yourself.</div>`
        + ledgerHTML(partB.title, partB.rows)
        + `<div class="frame" style="margin-bottom:12px;"><b>(a) Interpret the entry on 30 Sep 2026 for line (2).</b> Website hosting expense of $${amtBox('hosting','ta1','amount')} was ${wordBox('hosting','ta2','first word')} this year but not ${wordBox('hosting','ta3','second word')}, and was <span class="nw">${wordBox('hosting','ta4','last word')}.</span></div>`
        + `<div class="frame" style="margin-bottom:12px;"><b>(b) Interpret the entry on 30 Sep 2026 for line (3).</b> Website hosting expense of $${amtBox('hosting','tb1','amount')} was ${wordBox('hosting','tb2','first word')} during the year and <span class="nw">${wordBox('hosting','tb3','last word')}.</span></div>`
        + `<div class="btnrow" style="margin-top:20px;"><button class="btn btn-primary" data-model="b" disabled>Show the model answers</button></div>`
        + `<div data-modelout="b" style="display:none; margin-top:12px;"><div class="card-feedback show correct"><b>(a)</b> ${S8_MODEL.b[0]}<br><b>(b)</b> ${S8_MODEL.b[1]}</div>`
        + checklistHTML(`${box('the right amounts')} ${box("'paid … but not incurred' in that order for line (2)")} ${box("'adjusted' for line (2)")} ${box("'transferred to the Income Summary' for line (3)")}`) + `</div>`
        + `<div class="section-gap">${l3PartsHTML('hosting')}</div>`,
      init(el){
        initExitBlanks(el, S8_KEY); initGrow(el);
        initModelReveal(el, '[data-key^="l3-hosting-t"]', '[data-model="b"]', '[data-modelout="b"]', S8_KEY, 'b');
        initL3Item(el, 'hosting', S8_KEY);
      } },
    { html: `<div class="instruct">Last one. Write each answer in full, then compare with the model answers.</div>`
        + ledgerHTML(partC.title, partC.rows)
        + `<div class="frame" style="margin-bottom:12px;"><b>(a)</b> Interpret the entry on 30 Sep 2026 for line (2).<br><textarea class="fb freeform" data-key="l3-security-tx1" rows="2" aria-label="line 2"></textarea></div>`
        + `<div class="frame" style="margin-bottom:12px;"><b>(b)</b> Interpret the entry on 30 Sep 2026 for line (3).<br><textarea class="fb freeform" data-key="l3-security-tx2" rows="2" aria-label="line 3"></textarea></div>`
        + `<div class="btnrow" style="margin-top:20px;"><button class="btn btn-primary" data-model="c" disabled>Show the model answers</button></div>`
        + `<div data-modelout="c" style="display:none; margin-top:12px;"><div class="card-feedback show correct"><b>(a)</b> ${S8_MODEL.c[0]}<br><b>(b)</b> ${S8_MODEL.c[1]}</div>`
        + checklistHTML(`${box('the right amounts')} ${box("'incurred … but not paid' for line (2)")} ${box("'transferred to the Income Summary' for line (3)")}`) + `</div>`
        + `<div class="section-gap">${l3PartsHTML('security')}</div>`,
      init(el){
        initExitBlanks(el, S8_KEY);
        initModelReveal(el, '[data-key^="l3-security-tx"]', '[data-model="c"]', '[data-modelout="c"]', S8_KEY, 'c');
        initL3Item(el, 'security', S8_KEY);
      } }
  ];
  initRevealStage(container, S8_KEY, blocks);
}

/* ---- Exit Ticket (check and copy) ---- */
const L3X_KEY = 'l3-exit';
const L3X_OPTS2A = [
  "Cloud storage expense of $1 000 was incurred this year but not paid, and was adjusted.",
  "The company paid $1 000 for cloud storage on 30 Sep 2026.",
  "Cloud storage expense of $1 000 was paid this year but not incurred, and was adjusted.",
  "Cloud storage expense of $1 000 was incurred during the year and transferred to the Income Summary."
];
const L3X_2A_MSG = {
  0:"Line (2) is on the credit side and says 'Prepaid'. Was this part paid first, or used first?",
  1:"No money moves in an adjustment. The only payment was on 1 Mar 2026. What does line (2) do?",
  3:"That's what line (3) does. Look at the Particulars on line (2)."
};
const L3X_MODEL_1A = "Telephone expense of $450 was incurred this year but not paid, and was adjusted.";
const wordCount = s => (s.trim().match(/\S+/g) || []).length;

function renderL3Exit(container){
  markStageSeen('l3-exit');
  const $ = s => container.querySelector(s);
  const ta = () => $('[data-key="l3-tel-ta"]');
  const radio = () => container.querySelector('input[name="l3x-2a"]:checked');
  let item2Open = storage.get(`yecf.${L3X_KEY}.item2`, false);
  /* After the first check the model answer is showing, so 1(a) is read-only; its text as it was at the first
     check is saved with the first-check record (rec.extra) and used in the report. */
  const lockA = ()=>{ ta().readOnly = true; $('#l3x-lock').style.display = ''; $('#l3x-model').style.display = ''; };
  /* Seven checked questions: 1(b) (one statement sentence), 1(c) amount and dropdown, 2(a),
     2(b) (one statement sentence), 2(c) amount and dropdown. 1(a) is marked by the teacher. */
  const evaluate = ()=>{
    const r = [...l3Merged(container, 'tel'), ...l3Merged(container, 'cloud')].map(x=>({id:x.id, ok:x.ok, answers:x.answers}));
    r.splice(3, 0, {id:'cloud-a', ok: !!radio() && radio().value==='2'});
    return r;
  };
  const cfg = {
    storeKey: L3X_KEY, title: 'Lesson 3 Exit Ticket', criteria: OBJECTIVES.l3.criteria,
    intro: 'Before you check, make sure you have answered all questions, including Item 1(a) to 1(c) and Item 2(a) to 2(c).',
    note: 'Answer every question first, including Item 1(a) to 1(c) and Item 2(a) to 2(c).',
    isReady: ()=> item2Open && wordCount(ta().value)>0 && !!radio()
      && l3Fields('tel').every(f=> $(`[data-key="l3-tel-${f.id}"]`).value.trim()!=='')
      && l3Fields('cloud').every(f=> $(`[data-key="l3-cloud-${f.id}"]`).value.trim()!==''),
    evaluate,
    captureFirst: ()=>({tel_a: ta().value.trim()}),
    runCheck: ()=>{
      const t = l3Mark(container, 'tel', L3X_KEY), c = l3Mark(container, 'cloud', L3X_KEY);
      const tm = t.msgs.slice(); if(tm.length && t.attempts>=2) tm.push(DECODER_LINE);
      renderWrongList($('#l3fb-tel'), tm);
      const rd = radio(); const ok = !!rd && rd.value==='2';
      const msgs = c.msgs.slice(); let n2 = 0;
      if(rd && !ok && L3X_2A_MSG[rd.value]){ n2 = getAttempts(L3X_KEY,'l3-cloud-a')+1; setAttempts(L3X_KEY,'l3-cloud-a',n2); msgs.unshift('2(a) ' + L3X_2A_MSG[rd.value]); }
      else if(ok) setAttempts(L3X_KEY,'l3-cloud-a',0);
      if(msgs.length && (c.attempts>=2 || n2>=2)) msgs.push(DECODER_LINE);
      $('#l3x-2a-mark').textContent = ok ? '✓' : '✗'; $('#l3x-2a-mark').className = 'fb-icon ' + (ok?'correct':'wrong');
      renderWrongList($('#l3fb-cloud'), msgs);
      lockA();
      return evaluate();
    },
    bodyHTML: (results, rec)=>{
      const v = (item, id) => (container.querySelector(`[data-key="l3-${item}-${id}"]`)||{value:''}).value.trim();
      const res = id => results.find(r=>r.id===id);
      const rd = radio();
      /* The statement sentence is shown as the student's three dropdown choices. */
      const three = (item, gid) => { const a = res(`${item}-${gid}`).answers || [];
        return `Name: ${esc(a[0]||'(blank)')}<br>Statement: ${esc(a[1]||'(blank)')}<br>Amount: $${esc(a[2]||'(blank)')}`; };
      const G1 = 'Item 1: Telephone expense account', G2 = 'Item 2: Cloud storage expense account';
      const items = [
        {group:G1, id:'tel-a', label:'1(a) Interpret line (2)', answer:(rec.extra && rec.extra.tel_a!==undefined) ? rec.extra.tel_a : ta().value.trim(), ok:null},
        {group:G1, id:'tel-b', label:'1(b) Line (3): statement sentence', answerHTML:three('tel','b'), ok:res('tel-b').ok},
        {group:G1, id:'tel-c1', label:'1(c) Line (2): telephone expense payable ($)', answer:v('tel','c1'), ok:res('tel-c1').ok},
        {group:G1, id:'tel-c2', label:'1(c) Line (2): shown as', answer:v('tel','c2'), ok:res('tel-c2').ok},
        {group:G2, id:'cloud-a', label:'2(a) Interpret line (2)', answer:rd ? L3X_OPTS2A[rd.value] : '', ok:res('cloud-a').ok},
        {group:G2, id:'cloud-b', label:'2(b) Line (3): statement sentence', answerHTML:three('cloud','b'), ok:res('cloud-b').ok},
        {group:G2, id:'cloud-c1', label:'2(c) Line (2): prepaid cloud storage expense ($)', answer:v('cloud','c1'), ok:res('cloud-c1').ok},
        {group:G2, id:'cloud-c2', label:'2(c) Line (2): shown as', answer:v('cloud','c2'), ok:res('cloud-c2').ok}
      ];
      return reportTableHTML(items, rec);
    }
  };
  const tel = L3_ITEMS.tel, cloud = L3_ITEMS.cloud;
  container.innerHTML =
    decoderPanelHTML()
    + l2Chat([{who:'ceo', time:'9:38 AM', text:'The loan officer sent two more. Can you answer these on your own? Check your answers, then copy your work into your Google Doc.'}], 1)
    + `<div class="section-gap">${whoHTML()}</div>`
    + `<div class="section-gap card" style="border:2px solid var(--lines);"><h4>Item 1: ${tel.title}</h4>`
      + ledgerHTML('', tel.rows, {bare:true})
      + `<div class="frame section-gap"><b>1(a)</b> Interpret the entry on 30 Sep 2026 for line (2). Write it in full.<br><textarea class="fb freeform" data-key="l3-tel-ta" rows="2" aria-label="1(a)"></textarea><div id="l3x-lock" style="display:none; margin-top:6px; font-style:italic; color:var(--muted);">Your 1(a) answer is locked because the model answer is now showing.</div></div>`
      + `<div style="margin-top:12px;">${l3PartsHTML('tel', 0, {noCheck:true}).replace(/<div id="l3fb-tel"><\/div>$/, '')}</div>`
      + `<div id="l3x-model" style="display:none;"><div class="card-feedback show correct"><b>Model answer 1(a):</b> ${L3X_MODEL_1A}</div>`
      + checklistHTML(`${box('$450')} ${box("'incurred … but not paid' in that order")} ${box("'adjusted'")}`) + `</div>`
      + `<div id="l3fb-tel" style="margin-top:12px;"></div></div>`
    + `<div id="l3x-cont"><div class="btnrow" style="justify-content:center;"><button type="button" class="btn" id="l3x-contbtn" disabled>Continue to Item 2 ↓</button></div>
        <p id="l3x-contnote" style="text-align:center; font-style:italic; color:var(--muted); margin:12px 0 0;">Write your answer to 1(a) first (at least 5 words).</p></div>`
    + `<div id="l3x-item2" class="section-gap" style="display:none;"><div class="card" style="border:2px solid var(--lines);"><h4>Item 2: ${cloud.title}</h4>`
      + ledgerHTML('', cloud.rows, {bare:true})
      + `<p style="margin-top:16px;"><b>2(a)</b> Interpret the entry on 30 Sep 2026 for line (2). <span class="fb-icon" id="l3x-2a-mark"></span></p>`
      + `<div class="mcq-group">${L3X_OPTS2A.map((o,i)=>`<label class="mcq-option"><input type="radio" name="l3x-2a" value="${i}" autocomplete="off"> <span>${esc(o)}</span></label>`).join('')}</div>`
      + `<div style="margin-top:12px;">${l3PartsHTML('cloud', 0, {noCheck:true}).replace(/<div id="l3fb-cloud"><\/div>$/, '')}</div>`
      + `<div id="l3fb-cloud" style="margin-top:12px;"></div></div></div>`
    + `<div class="section-gap">${checkCopyHTML(cfg)}</div>`;

  initExitBlanks(container, L3X_KEY);
  const rec0 = getRec(L3X_KEY);
  if(rec0 && rec0.extra){ ta().value = rec0.extra.tel_a; lockA(); }   // a first check exists: show the saved text, locked
  const cc = initCheckCopy(container, cfg);
  /* Item 2 opens only when the student taps "Continue to Item 2 ↓" (enabled at 5 words in 1(a)); once
     opened it stays open, also after a reload. */
  const syncItem2 = ()=>{
    const enough = wordCount(ta().value)>=5;
    $('#l3x-contbtn').disabled = !enough;
    $('#l3x-contnote').style.display = enough ? 'none' : '';
    $('#l3x-cont').style.display = item2Open ? 'none' : '';
    $('#l3x-item2').style.display = item2Open ? '' : 'none';
  };
  $('#l3x-contbtn').addEventListener('click', ()=>{ item2Open = true; storage.set(`yecf.${L3X_KEY}.item2`, true); syncItem2(); cc.refresh(); });
  container.querySelectorAll('.fb, .fb-select, input[type=radio]').forEach(x=>{
    const on = ()=>{ syncItem2(); cc.refresh(); };
    x.addEventListener(x.type==='radio' ? 'change' : 'input', on);
    if(x.type!=='radio') x.addEventListener('change', on);
  });
  syncItem2(); cc.refresh();
}

/* ---- Closing ---- */
function renderL3Closing(container){
  markStageSeen('l3-closing');
  container.innerHTML = l2Chat([
    {who:'ceo', time:'9:44 AM', text:'Sent your answers to the bank. The loan officer says our books are "the clearest she\'s seen this month" 😎 Case closed, accountant.'},
    {who:'jay', time:'9:44 AM', text:'teach me the Decoder tmr pls 🙏'}
  ], 2);
}

(function init(){
  const p = parseHash();
  App.lesson = p.lesson; App.index = p.index;
  renderApp();
})();
