<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POA Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#141922; --muted:#58606E; --lines:#DCE0E7; --accent:#2C47D6; --accent-soft:#E7EBFC;
  --font-display:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body:'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.5;}
main{max-width:720px; margin:0 auto; padding:48px 16px;}
h1{font-family:var(--font-display); font-weight:800; font-size:2rem; line-height:1.25; margin:0 0 32px;}
.card{
  display:block; background:var(--surface); border:1px solid var(--lines); border-radius:14px; padding:20px;
  color:inherit; text-decoration:none;
}
.card:hover{border-color:var(--accent);}
.card:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
.card h2{font-family:var(--font-display); font-weight:600; font-size:1.25rem; line-height:1.3; margin:0; color:var(--accent);}
.card p{margin:8px 0 0; color:var(--muted);}
</style>
</head>
<body>
<main>
  <h1>POA Lessons</h1>
  <a class="card" href="year-end-case-file/">
    <h2>Chapter 7: Prepaid Expenses and Expenses Payable (The Year-End Case File)</h2>
  </a>
</main>
</body>
</html>
